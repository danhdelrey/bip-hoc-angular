# Tự build và deploy lên GitHub Pages (nhánh gh-pages) mỗi khi push lên main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:samples
      - run: npm run check:contrast
      - run: npm test -- --watch=false
      # base-href ./ + hash routing => chạy được ở https://<user>.github.io/<repo>/ mà không cần cấu hình thêm
      - run: npx ng build --base-href ./

      - name: Publish lên nhánh gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/bip-hoc-angular/browser
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
